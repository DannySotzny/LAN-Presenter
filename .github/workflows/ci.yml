name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore BeamerPresenterForLanParties.slnx --locked-mode
      - run: dotnet format BeamerPresenterForLanParties.slnx --verify-no-changes --no-restore
      - run: dotnet build BeamerPresenterForLanParties.slnx -c Release --no-restore
      - name: Test with coverage
        run: dotnet test BeamerPresenterForLanParties.slnx -c Release --no-build --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory artifacts/TestResults
      - name: Enforce 80 percent line coverage
        shell: pwsh
        run: ./scripts/Assert-Coverage.ps1 -ResultsDirectory artifacts/TestResults -Threshold 80
      - name: Publish self-contained application
        run: dotnet publish src/BeamerPresenter.App/BeamerPresenter.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: BeamerPresenter-win-x64-${{ github.sha }}
          path: artifacts/publish
