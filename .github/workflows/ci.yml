name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore BeamerPresenterForLanParties.slnx
      - run: dotnet build BeamerPresenterForLanParties.slnx -c Release --no-restore
      - run: dotnet test BeamerPresenterForLanParties.slnx -c Release --no-build
